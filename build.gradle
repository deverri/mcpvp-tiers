plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.10.0"
}

minecraft_version = project.minecraft_version
simple_version = project.simple_version
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "mcpvp-tiers" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Client game tests (screenshots of the lookup screen): `gradlew runClientGameTest`. Not part of the mod jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "mcpvp-tiers-gametest"
        enableGameTests = false
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    api "com.terraformersmc:modmenu:${modmenu_version}"
}

def forkMetadata = [
        fork_author : project.findProperty("fork_author") ?: "",
        homepage_url: project.findProperty("homepage_url") ?: "",
        sources_url : project.findProperty("sources_url") ?: "",
        issues_url  : project.findProperty("issues_url") ?: "",
]

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    forkMetadata.each { key, value -> inputs.property key, value }
    doFirst {
        if (forkMetadata.fork_author.isBlank())
            throw new GradleException("Set fork_author in gradle.properties before building a release")
    }
    filesMatching("fabric.mod.json") {
        expand([version: project.version, minecraft_version: project.minecraft_version] + forkMetadata)
    }
}

// Ship the license and the modification notice inside the jar (GPL-3.0)
jar {
    from("LICENSE") { rename { "LICENSE_${project.archives_base_name}" } }
    from("NOTICE.md") { rename { "NOTICE_${project.archives_base_name}.md" } }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Upload with `gradlew modrinth` (needs MODRINTH_TOKEN and modrinth_project_id in gradle.properties).
// Deliberately has no default project id so nothing can be uploaded to the original Tiers project.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = project.findProperty("modrinth_project_id") ?: ""
    versionNumber = "${project.version}"
    versionName = "MCPvP Tiers ${project.simple_version}"
    changelog = project.file("CHANGELOG.md").exists() ? project.file("CHANGELOG.md").text : ""
    uploadFile = jar
    versionType = "beta"
    gameVersions = [project.minecraft_version]
    loaders = ["fabric", "quilt"]
    environment = "client_only"

    dependencies {
        required.project "P7dR8mSH" // Fabric API
        optional.project "mOgUt4GM" // Mod Menu
    }
}

tasks.modrinth.dependsOn(tasks.jar)
tasks.modrinth.doFirst {
    if ((project.findProperty("modrinth_project_id") ?: "").isBlank())
        throw new GradleException("Set modrinth_project_id in gradle.properties to your own Modrinth project")
}
